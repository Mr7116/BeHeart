# Builds BeHeart.ipa for iPhone on a GitHub-hosted Mac — no Mac of your own needed.
#
#  • Always: an UNSIGNED BeHeart-unsigned.ipa. Install it with Sideloadly / AltStore using your
#    Apple ID (free Apple IDs: the app must be re-installed every 7 days).
#  • When the repository has the secrets below, also a SIGNED BeHeart.ipa you can install directly
#    (Ad Hoc) or upload to TestFlight (App Store profile):
#      IOS_P12_BASE64            base64 of your Apple Distribution certificate (.p12)
#      IOS_P12_PASSWORD          its password
#      IOS_PROFILE_BASE64        base64 of the provisioning profile (.mobileprovision) for com.beheart.app
#      IOS_TEAM_ID               your 10-character Apple Team ID
#      IOS_EXPORT_METHOD         release-testing (Ad Hoc) or app-store-connect (TestFlight)  [optional, default release-testing]
#
# Run it from GitHub → Actions → "Build iOS app (.ipa)" → Run workflow. The .ipa files appear under Artifacts.
name: Build iOS app (.ipa)

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  ipa:
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/mobile/package-lock.json

      - name: Use the newest Xcode on the runner
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit -p tsconfig.json

      - name: Bundle JavaScript (same step Xcode runs)
        run: node scripts/bundle-ios.js

      - name: Generate the native iOS project (Expo prebuild + CocoaPods)
        run: npx expo prebuild -p ios --clean
        env:
          CI: '1'

      - name: Build (unsigned, Release, device)
        run: |
          set +e
          xcodebuild \
            -workspace ios/BeHeart.xcworkspace \
            -scheme BeHeart \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > xcodebuild.log 2>&1
          STATUS=$?
          if [ $STATUS -ne 0 ]; then
            echo "---------------- errors ----------------"
            grep -nE "error:|error [A-Z]|Error:|BUILD FAILED|The following build commands failed|^\s+(CompileSwift|CompileC|PhaseScriptExecution|Ld|SwiftCompile|SwiftEmitModule)" xcodebuild.log | grep -v "^.*note:" | head -60
            echo "---------------- last 150 lines ----------------"
            tail -n 150 xcodebuild.log
            # Put the errors in the run summary (annotations are readable without opening the log).
            MSG=$( (grep -E "error:|Error:" xcodebuild.log | grep -v "note:" | sort -u | head -25; echo; grep -A12 "The following build commands failed" xcodebuild.log | head -14) | cut -c1-400 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error title=xcodebuild failed::${MSG}"
            exit $STATUS
          fi
          tail -n 20 xcodebuild.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: app/mobile/xcodebuild.log
          if-no-files-found: ignore

      - name: Package BeHeart-unsigned.ipa
        run: |
          rm -rf Payload && mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/BeHeart.app Payload/
          # An unsigned build carries no entitlements, and sideloading tools copy entitlements from the
          # app binary — so without this the re-signed app has no HealthKit permission.
          # Ad-hoc sign with the HealthKit entitlement (background delivery left out: free Apple IDs
          # can't get it, and asking for it makes their signing fail).
          cat > sideload.entitlements <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>com.apple.developer.healthkit</key><true/>
            <key>com.apple.developer.healthkit.access</key><array/>
          </dict></plist>
          EOF
          if [ -d Payload/BeHeart.app/Frameworks ]; then
            find Payload/BeHeart.app/Frameworks -maxdepth 1 \( -name '*.framework' -o -name '*.dylib' \) -exec codesign --force --sign - --timestamp=none {} \;
          fi
          codesign --force --sign - --timestamp=none --entitlements sideload.entitlements Payload/BeHeart.app
          codesign -d --entitlements - Payload/BeHeart.app
          zip -qry BeHeart-unsigned.ipa Payload
          ls -lh BeHeart-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: BeHeart-unsigned-ipa
          path: app/mobile/BeHeart-unsigned.ipa

      # ---------------------------------------------------------------- signed .ipa (optional)
      - name: Check for signing secrets
        id: signing
        env:
          P12: ${{ secrets.IOS_P12_BASE64 }}
        run: echo "enabled=$([ -n "$P12" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Install certificate and provisioning profile
        if: steps.signing.outputs.enabled == 'true'
        env:
          P12: ${{ secrets.IOS_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: |
          KEYCHAIN=$RUNNER_TEMP/signing.keychain-db
          security create-keychain -p ci "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p ci "$KEYCHAIN"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k ci "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILE" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' /dev/stdin <<< "$(security cms -D -i "$RUNNER_TEMP/profile.mobileprovision")")
          NAME=$(/usr/libexec/PlistBuddy -c 'Print Name' /dev/stdin <<< "$(security cms -D -i "$RUNNER_TEMP/profile.mobileprovision")")
          cp "$RUNNER_TEMP/profile.mobileprovision" ~/Library/MobileDevice/Provisioning\ Profiles/$UUID.mobileprovision
          echo "PROFILE_NAME=$NAME" >> "$GITHUB_ENV"

      - name: Archive and export signed BeHeart.ipa
        if: steps.signing.outputs.enabled == 'true'
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          METHOD: ${{ secrets.IOS_EXPORT_METHOD || 'release-testing' }}
        run: |
          set -o pipefail
          xcodebuild \
            -workspace ios/BeHeart.xcworkspace -scheme BeHeart -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -archivePath build/BeHeart.xcarchive \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            archive | tail -n 200
          cat > build/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>$METHOD</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key><dict><key>com.beheart.app</key><string>$PROFILE_NAME</string></dict>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath build/BeHeart.xcarchive -exportOptionsPlist build/ExportOptions.plist -exportPath build/export
          cp build/export/*.ipa BeHeart.ipa

      - uses: actions/upload-artifact@v4
        if: steps.signing.outputs.enabled == 'true'
        with:
          name: BeHeart-signed-ipa
          path: app/mobile/BeHeart.ipa
